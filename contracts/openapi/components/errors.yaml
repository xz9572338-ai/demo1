components:
  schemas:
    Error:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items: { type: object, additionalProperties: true }
        retryable: { type: boolean }
