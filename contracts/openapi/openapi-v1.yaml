openapi: 3.1.0
info: { title: Open Platform Production API, version: 1.0.0, license: { name: Proprietary, identifier: LicenseRef-Proprietary } }
servers: [{ url: /openapi/v1 }]
paths:
  /customers/{customerId}: { $ref: './components/public-api.yaml#/paths/Customer' }
  /orders: { $ref: './components/public-api.yaml#/paths/Orders' }
  /orders/{orderId}: { $ref: './components/public-api.yaml#/paths/Order' }
components:
  x-signing: { $ref: './components/public-api.yaml#/components/x-signing' }
  x-error-catalog: { $ref: './components/public-api.yaml#/components/x-error-catalog' }
  securitySchemes:
    AppId: { $ref: './components/public-api.yaml#/components/securitySchemes/AppId' }
    Timestamp: { $ref: './components/public-api.yaml#/components/securitySchemes/Timestamp' }
    Nonce: { $ref: './components/public-api.yaml#/components/securitySchemes/Nonce' }
    Signature: { $ref: './components/public-api.yaml#/components/securitySchemes/Signature' }
  schemas:
    Error: { $ref: './components/public-api.yaml#/components/schemas/Error' }
