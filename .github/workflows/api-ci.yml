name: API CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: API CI / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: sh ./mvnw verify
      - run: docker build -t open-platform-api:ci apps/api
