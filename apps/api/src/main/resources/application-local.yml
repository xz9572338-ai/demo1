spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:open_platform}}
    username: ${MYSQL_USER:open_platform}
    password: ${MYSQL_PASSWORD:local_only_password}

server:
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

management:
  endpoint:
    health:
      probes:
        enabled: true

open-platform:
  security:
    phone-key: ${PHONE_ENCRYPTION_KEY}
    phone-key-id: ${PHONE_ENCRYPTION_KEY_ID:local-v1}
    app-secret-key: ${APP_SECRET_ENCRYPTION_KEY}
    app-secret-key-id: ${APP_SECRET_ENCRYPTION_KEY_ID:app-local-v1}
